spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/lakmal-yapa-22/smart-clinic-project-configuration.git
          search-paths: platform, services
        native:
          search-locations:
            - classpath:/configurations
            - classpath:/configurations/platform
            - classpath:/configurations/services

server:
  port: 9000
